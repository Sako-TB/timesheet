function App() {

    return {
      id: gen(),

      ms: '',
      me: '',
      as: '',
      ae: ''
    };
  }

  // --- Time calculations ---
  // Accepts "13:30", "13:30:00", "1:30 PM", "1.30pm", etc.
  const parseTime = t => {
    if (t === null || t === undefined) return null;
    const s = String(t).trim().replace(/\u00a0|\u202f/g, ' ');
    if (!s) return null;
    const m = s.match(/^(\d{1,2})[:.h](\d{1,2})(?::(\d{1,2}))?\s*(a\.?m\.?|p\.?m\.?)?$/i);
    if (!m) return null;
    let hours = parseInt(m[1], 10);
    const mins = parseInt(m[2], 10);
    const ap = m[4] ? m[4][0].toLowerCase() : null;
    if (isNaN(hours) || isNaN(mins) || mins > 59) return null;
    if (ap === 'a' && hours === 12) hours = 0;else if (ap === 'p' && hours !== 12) hours += 12;
    if (hours > 24) return null;
    return hours * 60 + mins;
  };

  // Duration of one session. Returns null if incomplete, -1 if end <= start.
  const sessionMinutes = (startStr, endStr) => {
    const a = parseTime(startStr);
    const b = parseTime(endStr);
    if (a === null && b === null) return null; // nothing entered
    if (a === null || b === null) return -1; // only half filled
    if (b <= a) return -1; // end before/equal start
    return b - a;
  };
  const entryMinutes = e => {
    const am = sessionMinutes(e.ms, e.me);
    const pm = sessionMinutes(e.as, e.ae);
    let total = 0;
    if (am && am > 0) total += am;
    if (pm && pm > 0) total += pm;
    return total;
  };

  // 'empty' | 'ok' | 'invalid'  — drives the on-screen warning
  const entryStatus = e => {
    const anyFilled = [e.ms, e.me, e.as, e.ae].some(v => v && String(v).trim());
    if (!anyFilled) return 'empty';
    const am = sessionMinutes(e.ms, e.me);
    const pm = sessionMinutes(e.as, e.ae);
    if (am === -1 || pm === -1) return 'invalid';
    if ((am || 0) + (pm || 0) <= 0) return 'invalid';
